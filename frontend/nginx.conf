server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Must always be revalidated, or installed phones would be stuck on an old version
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
  }

  # A missing file must be a 404: answering it with index.html would poison the offline cache
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
