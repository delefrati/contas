<!doctype html>
<!-- The app has its own languages: a browser translating on top rewrites songs and lyrics
     and breaks the page when Vue updates text it no longer recognises -->
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minhabanda.com</title>
    <!-- The theme chosen in Configurações, before the first paint so the page doesn't flash
         (src/theme.js keeps it up to date) -->
    <script>
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
